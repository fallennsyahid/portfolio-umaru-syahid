<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/slider.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
    />
  </head>
  <body>
    <!-- <section class="container swiper"> -->
    <div class="container swiper">
      <div class="card-wrapper">
        <ul class="card-list swiper-wrapper">
          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img src="img/portfolio/1.webp" alt="1" class="card-image" />
              <p class="badge website">Website</p>
              <h2 class="card-title">Pondok Umaru Cottage</h2>
              <button class="card-button">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </a>
          </li>
          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img src="img/portfolio/2.webp" alt="2" class="card-image" />
              <p class="badge website">Website</p>
              <h2 class="card-title">Miss Tea Shop</h2>
              <button class="card-button">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </a>
          </li>
          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img src="img/portfolio/3.webp" alt="3" class="card-image" />
              <p class="badge website">Webiste</p>
              <h2 class="card-title">BangbaraPOS</h2>
              <button class="card-button">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </a>
          </li>
          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img src="img/portfolio/4.webp" alt="4" class="card-image" />
              <p class="badge mobile">Mobile App</p>
              <h2 class="card-title">Qode - Al Quran App</h2>
              <button class="card-button">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </a>
          </li>
          <li class="card-item swiper-slide">
            <a href="#" class="card-link">
              <img src="img/portfolio/8.webp" alt="5" class="card-image" />
              <p class="badge design">Web Design</p>
              <h2 class="card-title">Cooperative Web Design</h2>
              <button class="card-button">
                <i class="fa-solid fa-arrow-right"></i>
              </button>
            </a>
          </li>
        </ul>

        <div class="swiper-pagination"></div>
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>
      </div>
    </div>
    <!-- </section> -->
  </body>
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <script src="js/slider.js"></script>
</html>
