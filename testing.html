<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    .page-wrapper {
      width: 100%;
      height: 100%;
      background: url(https://i.imgur.com/2ZgHKbQ.jpg) center no-repeat;
      background-size: cover;
    }

    .blur {
      -webkit-filter: blur(5px);
      -moz-filter: blur(5px);
      -o-filter: blur(5px);
      -ms-filter: blur(5px);
      filter: blur(5px);
    }

    a.btn {
      width: 150px;
      display: block;
      margin: -25px 0 0 -75px;
      padding: 1em 0;
      position: absolute;
      top: 50%;
      left: 50%;
      font:
        1.125em "Arial",
        sans-serif;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      color: #fff;
      border-radius: 5px;
      background: rgba(217, 67, 86, 1);
    }

    .modal-wrapper {
      width: 100%;
      height: 100%;
      position: fixed;
      top: 0;
      left: 0;
      background: rgba(255, 257, 153, 0.75);
      visibility: hidden;
      opacity: 0;
      -webkit-transition: all 0.25s ease-in-out;
      -moz-transition: all 0.25s ease-in-out;
      -o-transition: all 0.25s ease-in-out;
      transition: all 0.25s ease-in-out;
    }

    .modal-wrapper.open {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: 50%;
      height: 85%;
      display: block;
      margin: 30% 0 0 -300px;
      position: relative;
      top: 40%;
      left: 50%;
      background: #fff;
      opacity: 0;
      -webkit-transition: all 0.5s ease-in-out;
      -moz-transition: all 0.5s ease-in-out;
      -o-transition: all 0.5s ease-in-out;
      transition: all 0.5s ease-in-out;
    }

    .modal-wrapper.open .modal {
      margin-top: -200px;
      opacity: 1;
    }

    .head {
      width: 90%;
      height: 32px;
      padding: 1.5em 5%;
      overflow: hidden;
      background: #01bce5;
    }

    .btn-close {
      width: 32px;
      height: 32px;
      display: block;
      float: right;
    }

    .btn-close::before,
    .btn-close::after {
      content: "";
      width: 32px;
      height: 6px;
      display: block;
      background: #fff;
    }

    .btn-close::before {
      margin-top: 12px;
      -webkit-transform: rotate(45deg);
      -moz-transform: rotate(45deg);
      -o-transform: rotate(45deg);
      transform: rotate(45deg);
    }

    .btn-close::after {
      margin-top: -6px;
      -webkit-transform: rotate(-45deg);
      -moz-transform: rotate(-45deg);
      -o-transform: rotate(-45deg);
      transform: rotate(-45deg);
    }

    .content {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: auto;
      box-sizing: border-box;
    }

    .content img {
      max-width: 100%;
      max-height: 60vh; /* Batas tinggi gambar agar tidak memakan seluruh ruang */
      height: auto;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .content p {
      text-align: center;
      max-width: 90%;
      line-height: 1.6;
    }
  </style>

  <body>
    <div class="page-wrapper">
      <a class="btn trigger" href="javascript:;">Click Me!</a>
    </div>
    <div class="modal-wrapper">
      <div class="modal">
        <div class="head">
          <a class="btn-close trigger" href="javascript:;"></a>
        </div>
        <div class="content">
          <img src="img/certificate/1r.jpg" alt="" width="100%" />
          <p>
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. At sint
            minima quia odio praesentium repellat! Odit sunt velit provident
            fuga.
          </p>
        </div>
      </div>
    </div>
  </body>
  <script>
    const trigger = document.querySelector(".trigger");
    const modal = document.querySelector(".modal-wrapper");
    const modalBg = document.querySelector(".page-wrapper");

    trigger.addEventListener("click", (e) => {
      modal.classList.toggle("open");
      modalBg.classList.toggle("blue");
      e.preventDefault();
    });
  </script>
</html>
